<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle Crush NFT — Premium Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #f5c542;
  --gold-dark: #b8860b;
  --gold-glow: rgba(245, 197, 66, 0.5);
  --bg-dark: #0a0a0f;
  --bg-card: rgba(20, 20, 30, 0.85);
  --bg-card-hover: rgba(30, 30, 45, 0.95);
  --border-gold: rgba(245, 197, 66, 0.3);
  --text-main: #f0f0f5;
  --text-dim: #a0a0b0;
  --success: #22c55e;
  --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-dark);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(245,197,66,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(139,92,246,0.08) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(30,30,50,0.5) 0%, transparent 70%);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  padding-bottom: 60px;
  overflow-x: hidden;
}
header {
  background: linear-gradient(135deg, #0f0f18 0%, #1a1a2e 50%, #0f0f18 100%);
  border-bottom: 1px solid var(--border-gold);
  padding: 20px 20px 15px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1400px;
  margin: 0 auto;
  gap: 15px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 20px var(--gold-glow);
  flex-shrink: 0;
}
.brand-text { display: flex; flex-direction: column; }
.brand-title {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 20px;
  background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, var(--gold-dark) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
  line-height: 1.1;
}
.brand-sub {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.vip-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #000;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
  letter-spacing: 1px;
  box-shadow: 0 0 15px var(--gold-glow);
  white-space: nowrap;
}
.search-wrap {
  max-width: 1400px;
  margin: 15px auto 0;
  padding: 0 20px;
  position: relative;
}
.search-input {
  width: 100%;
  padding: 12px 45px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  color: var(--text-main);
  font-size: 14px;
  font-family: inherit;
  transition: all 0.3s;
}
.search-input:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(245,197,66,0.05);
  box-shadow: 0 0 15px rgba(245,197,66,0.15);
}
.search-input::placeholder { color: var(--text-dim); }
.search-icon {
  position: absolute;
  left: 35px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 16px;
  pointer-events: none;
}
.filters {
  max-width: 1400px;
  margin: 12px auto 0;
  padding: 0 20px 5px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter-chip {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-dim);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.25s;
  font-family: inherit;
}
.filter-chip:hover { border-color: var(--gold); color: var(--gold); }
.filter-chip.active {
  background: var(--gold);
  color: #000;
  border-color: var(--gold);
  box-shadow: 0 0 15px var(--gold-glow);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
  padding: 20px;
  max-width: 1400px;
  margin: 0 auto;
}
.card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 10px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  animation: cardIn 0.4s ease-out backwards;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.card:hover {
  transform: translateY(-6px);
  border-color: var(--border-gold);
  background: var(--bg-card-hover);
  box-shadow: 0 15px 40px rgba(0,0,0,0.5), 0 0 25px rgba(245,197,66,0.12);
}
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transition: left 0.6s;
}
.card:hover::before { left: 100%; }
.card-img-wrap {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  background: linear-gradient(135deg, #1a1a28 0%, #0f0f18 100%);
  aspect-ratio: 1/1;
  margin-bottom: 8px;
}
.card img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s;
}
.card:hover img { transform: scale(1.08); }
.rarity-badge {
  position: absolute;
  top: 6px; right: 6px;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
}
.rarity-common { background: rgba(107,114,128,0.85); color: #fff; }
.rarity-rare { background: rgba(59,130,246,0.9); color: #fff; box-shadow: 0 0 12px rgba(59,130,246,0.5); }
.rarity-epic { background: rgba(168,85,247,0.9); color: #fff; box-shadow: 0 0 12px rgba(168,85,247,0.5); }
.rarity-legendary { background: linear-gradient(135deg, #f5c542, #b8860b); color: #000; box-shadow: 0 0 15px var(--gold-glow); }
.card h4 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
  margin: 6px 0 4px;
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.3;
}
.card .price {
  font-size: 16px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 8px;
  text-shadow: 0 0 10px rgba(245,197,66,0.3);
}
.buy-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
  color: #000;
  border: none;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
  text-transform: uppercase;
}
.buy-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--gold-glow);
  filter: brightness(1.1);
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index: 999;
  overflow-y: auto;
  padding: 30px 15px;
  animation: fadeIn 0.25s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: linear-gradient(135deg, #14141f 0%, #0a0a12 100%);
  border: 1px solid var(--border-gold);
  width: 100%;
  max-width: 440px;
  margin: 20px auto;
  padding: 26px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(245,197,66,0.15);
  animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.85) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-box h3 {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  color: var(--gold);
  margin-bottom: 6px;
  letter-spacing: 2px;
}
.modal-box .subtitle {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 18px;
}
.modal img {
  width: 100%;
  max-width: 340px;
  border-radius: 12px;
  margin-bottom: 18px;
  border: 2px solid var(--border-gold);
  padding: 6px;
  background: #fff;
}
.modal-buttons { display: flex; flex-direction: column; gap: 10px; }
.modal-buttons button {
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.25s;
  letter-spacing: 0.5px;
}
.btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; }
.btn-gold:hover { filter: brightness(1.1); box-shadow: 0 6px 20px var(--gold-glow); }
.btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
.btn-blue:hover { filter: brightness(1.15); }
.btn-red { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }
.btn-red:hover { filter: brightness(1.15); }
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: linear-gradient(135deg, #14141f, #0a0a12);
  border: 1px solid var(--border-gold);
  color: var(--text-main);
  padding: 12px 22px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  z-index: 10000;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.loading-wrap {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.spinner {
  width: 50px; height: 50px;
  border: 3px solid rgba(245,197,66,0.15);
  border-top-color: var(--gold);
  border-radius: 50%;
  margin: 0 auto 15px;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-dim);
  font-size: 12px;
  border-top: 1px solid rgba(255,255,255,0.05);
  margin-top: 40px;
}
footer a { color: var(--gold); text-decoration: none; font-weight: 500; }
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty .emoji { font-size: 48px; margin-bottom: 10px; }
@media (max-width: 600px) {
  .brand-title { font-size: 15px; letter-spacing: 1px; }
  .brand-sub { font-size: 8px; letter-spacing: 2px; }
  .brand-icon { width: 36px; height: 36px; font-size: 18px; }
  .vip-tag { font-size: 9px; padding: 3px 8px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 12px; }
  .modal-box { padding: 20px; max-width: 92%; }
  .modal img { max-width: 280px; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon">🏰</div>
      <div class="brand-text">
        <div class="brand-title">CASTLE CRUSH</div>
        <div class="brand-sub">Premium NFT Collection</div>
      </div>
    </div>
    <div class="vip-tag">💎 VIP</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="Search items..." oninput="filterItems()">
  </div>
  <div class="filters" id="filters">
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="common">Common</button>
    <button class="filter-chip" data-filter="rare">Rare</button>
    <button class="filter-chip" data-filter="epic">Epic</button>
    <button class="filter-chip" data-filter="legendary">Legendary</button>
  </div>
</header>

<div id="items" class="grid">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <p>Loading premium collection...</p>
  </div>
</div>

<div id="qrModal" class="modal">
  <div class="modal-box">
    <h3>SCAN & PAY</h3>
    <p class="subtitle" id="modalItemName">Complete your purchase</p>
    <img id="qrImg" src="images/qr.png" alt="QR Code">
    <div class="modal-buttons">
      <button class="btn-gold" onclick="downloadQR()">⬇ Download QR</button>
      <button class="btn-blue" onclick="sendProof()">📱 Send Payment Proof</button>
      <button class="btn-red" onclick="closeQR()">✖ Close</button>
    </div>
  </div>
</div>

<footer>
  <p>© 2025 Castle Crush NFT — Premium Collection</p>
  <p style="margin-top:6px; font-size:11px;">Powered by <a href="#">Castle Studios</a></p>
</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ⚙️ JSONBIN.IO CONFIGURATION
   ========================================================= */
const JSONBIN_BIN_ID = "6ac357e4ac6210605a14a526";
const JSONBIN_API = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;
const JSONBIN_ACCESS_KEY = "$2a$10$6bFdhxMc0uG0w4bx49sjo.n6rcI1.IQwhBC3jaazynD7ZzkAM9kWS";
/* ========================================================= */

const defaultItems = [
  {name:"Ape Pirate", price:79, img:"ape_pirate.png"},
  {name:"Archer's Tribe", price:79, img:"archers_tribe.png"},
  {name:"Arrows", price:49, img:"arrows.png"},
  {name:"Fortify", price:49, img:"fortify.png"},
  {name:"Warrior", price:69, img:"warrior.png"},

  {name:"Giant Growth", price:99, img:"giant_growth.png"},
  {name:"Golem", price:79, img:"golem.png"},
  {name:"Skeletons Swarm", price:59, img:"skeletons_swarm.png"},
  {name:"Skeletons", price:39, img:"skeletons.png"},
  {name:"Nature Heal", price:39, img:"nature_heal.png"},
  {name:"Poison", price:39, img:"poison.png"},
  {name:"Bomb", price:39, img:"bomb.png"},
  {name:"Skeletons Legion", price:79, img:"skeletons_legion.png"},
  {name:"Triplets", price:89, img:"triplets.png"},
  {name:"Executioner", price:149, img:"executioner.png"},
  {name:"Blizzard", price:89, img:"blizzard.png"},
  {name:"Cannon Shot", price:99, img:"cannon_shot.png"},
  {name:"Catapult", price:139, img:"catapult.png"},
  {name:"Dryad", price:149, img:"dryad.png"},
  {name:"Meteor", price:99, img:"meteor.png"},
  {name:"Inferno", price:99, img:"inferno.png"},
  {name:"Gust of Wind", price:89, img:"gust_of_wind.png"},
  {name:"Ice Golem", price:149, img:"ice_golem.png"},
  {name:"Rage", price:89, img:"rage.png"},
  {name:"Magician", price:99, img:"magician.png"},
  {name:"Mud Elemental", price:199, img:"mud_elemental.png"},
  {name:"Orc Warrior", price:99, img:"orc_warrior.png"},
  {name:"Orcs Horde", price:249, img:"orcs_horde.png"},
  {name:"Stone Statue", price:99, img:"stone_statue.png"},
  {name:"Spiked Statue", price:249, img:"spiked_statue.png"},
  {name:"Siege Ballista", price:99, img:"siege_ballista.png"},
  {name:"Lightning", price:149, img:"lightning.png"},
  {name:"Hollow Knight", price:349, img:"hollow_knight.png"},
  {name:"Shaman", price:349, img:"shaman.png"},
  {name:"Archer Queen", price:349, img:"archer_queen.png"},
  {name:"Angel", price:199, img:"angel.png"},
  {name:"Demon", price:169, img:"demon.png"},
  {name:"Fire Elemental", price:269, img:"fire_elemental.png"},
  {name:"Genie Lamp", price:149, img:"genie_lamp.png"},
  {name:"Mage", price:2599, img:"mage.png"},
  {name:"Mana Ritual", price:199, img:"mana_ritual.png"},
  {name:"Black Knight", price:199, img:"black_knight.png"},
  {name:"Metamorph", price:199, img:"metamorph.png"},
  {name:"Skull King", price:199, img:"skull_king.png"},
  {name:"Spectre", price:349, img:"spectre.png"},
  {name:"Reaper", price:199, img:"reaper.png"},
  {name:"Resurrection", price:149, img:"resurrection.png"},
  {name:"Shock", price:149, img:"shock.png"},
  {name:"Standard Bearer", price:159, img:"standard_bearer.png"},
  {name:"Unchained Demon", price:4000, img:"unchained_demon.png"},
  {name:"Wraith", price:199, img:"wraith.png"},
  {name:"Dragon", price:5999, img:"dragon.png"},
  {name:"Storm Elemental", price:2549, img:"storm_elemental.png"},
  {name:"Skull Queen", price:5999, img:"skull_queen.png"},
  {name:"Phoenix", price:5599, img:"phoenix.png"},
  {name:"Black Witch", price:5949, img:"black_witch.png"},
  {name:"Necromancer", price:4949, img:"necromancer.png"}
];

function getRarity(price){
  if(price >= 1000) return "legendary";
  if(price >= 300) return "epic";
  if(price >= 100) return "rare";
  return "common";
}

let items = [...defaultItems];
let wa = "27832500800";
let selectedItem = "";
let currentFilter = "all";
let currentSearch = "";

function showToast(msg, type = ""){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + type;
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => { t.className = "toast " + type; }, 2500);
}

async function loadFromServer(){
  try {
    const res = await fetch(JSONBIN_API + "/latest", {
      headers: {
        "X-Bin-Meta": "false",
        "X-Access-Key": JSONBIN_ACCESS_KEY
      }
    });
    if(!res.ok) throw new Error("Failed to load");
    const data = await res.json();

    if(data.items && data.items.length > 0){
      items = data.items;
    }
    if(data.wa) wa = data.wa;

    renderUser();
  } catch(e){
    console.error("Load error:", e);
    const cached = localStorage.getItem("items");
    if(cached){
      try { items = JSON.parse(cached); } catch(e2){}
    }
    showToast("Offline mode — showing cached data", "error");
    renderUser();
  }
}

function renderUser(){
  const box = document.getElementById("items");
  if(!box) return;

  let filtered = items.filter(i => {
    const matchSearch = i.name.toLowerCase().includes(currentSearch.toLowerCase());
    const matchFilter = currentFilter === "all" || getRarity(i.price) === currentFilter;
    return matchSearch && matchFilter;
  });

  if(filtered.length === 0){
    box.innerHTML = `<div class="empty"><div class="emoji">🔍</div><p>No items found</p></div>`;
    return;
  }

  let html = "";
  filtered.forEach((i) => {
    const idx = items.indexOf(i);
    const safeName = i.name.replace(/"/g, "&quot;");
    const rarity = getRarity(i.price);
    html += `
      <div class="card" style="animation-delay:${Math.min(idx * 15, 400)}ms">
        <div class="card-img-wrap">
          <img src="images/${i.img}" alt="${safeName}"
               onerror="this.onerror=null; this.src='images/qr.png';">
          <span class="rarity-badge rarity-${rarity}">${rarity}</span>
        </div>
        <h4>${i.name}</h4>
        <div class="price">₹${i.price}</div>
        <button class="buy-btn" onclick="buy(${idx})">BUY NOW</button>
      </div>`;
  });
  box.innerHTML = html;
}

function filterItems(){
  currentSearch = document.getElementById("searchInput").value;
  renderUser();
}

document.addEventListener("click", (e) => {
  if(e.target.classList.contains("filter-chip")){
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
    e.target.classList.add("active");
    currentFilter = e.target.dataset.filter;
    renderUser();
  }
});

function buy(idx){
  selectedItem = items[idx].name;
  document.getElementById("modalItemName").textContent = selectedItem + " — ₹" + items[idx].price;
  document.getElementById("qrModal").style.display = "block";
}

function closeQR(){
  document.getElementById("qrModal").style.display = "none";
}

function sendProof(){
  if(!selectedItem){ showToast("Please select an item first", "error"); return; }
  const msg = encodeURIComponent(`Payment done for ${selectedItem}`);
  window.open(`https://wa.me/${wa}?text=${msg}`, "_blank");
}

function downloadQR(){
  try {
    const a = document.createElement("a");
    a.href = "images/qr.png";
    a.download = "castle-crush-qr.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast("QR downloaded!", "success");
  } catch(e){
    showToast("Download failed. Long-press QR to save.", "error");
  }
}

loadFromServer();
</script>
</body>
</html>
