<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Castle Crush NFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #f5c542;
  --gold-dark: #b8860b;
  --gold-glow: rgba(245, 197, 66, 0.5);
  --bg-dark: #0a0a0f;
  --text-main: #f0f0f5;
  --text-dim: #a0a0b0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-dark);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(245,197,66,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(139,92,246,0.08) 0%, transparent 40%);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  padding-bottom: 120px;
}

/* ========== LOCK SCREEN ========== */
#lockScreen {
  position: fixed;
  inset: 0;
  background: var(--bg-dark);
  background-image:
    radial-gradient(circle at 50% 30%, rgba(245,197,66,0.12) 0%, transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(139,92,246,0.1) 0%, transparent 50%);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lock-box {
  background: linear-gradient(135deg, #14141f 0%, #0a0a12 100%);
  border: 1px solid rgba(245,197,66,0.3);
  padding: 40px 30px;
  border-radius: 20px;
  text-align: center;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(245,197,66,0.1);
}
.lock-icon {
  font-size: 48px;
  margin-bottom: 12px;
  filter: drop-shadow(0 0 20px rgba(245,197,66,0.5));
}
.lock-box h2 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-size: 24px;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.lock-box p {
  color: var(--text-dim);
  font-size: 12px;
  margin-bottom: 24px;
  letter-spacing: 1px;
}
.lock-box input {
  width: 100%;
  padding: 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: var(--text-main);
  font-size: 15px;
  font-family: inherit;
  text-align: center;
  letter-spacing: 3px;
  margin-bottom: 14px;
  transition: all 0.3s;
}
.lock-box input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(245,197,66,0.2);
}
.lock-box button {
  width: 100%;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #000;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
  margin-bottom: 10px;
}
.lock-box button:hover { filter: brightness(1.1); box-shadow: 0 6px 20px var(--gold-glow); }
.lock-box button.back-btn {
  background: transparent;
  color: var(--gold);
  border: 1px solid rgba(245,197,66,0.3);
  font-size: 12px;
}
.lock-box button.back-btn:hover {
  background: rgba(245,197,66,0.08);
  box-shadow: none;
}
.lock-error {
  color: #ef4444;
  font-size: 12px;
  margin-top: 6px;
  min-height: 18px;
}

/* ========== MAIN CONTENT ========== */
#mainContent { display: none; }
#mainContent.unlocked { display: block; }

header {
  background: linear-gradient(135deg, #0f0f18 0%, #1a1a2e 50%, #0f0f18 100%);
  border-bottom: 1px solid rgba(245,197,66,0.3);
  padding: 20px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
}
header h1 {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  letter-spacing: 3px;
  background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, var(--gold-dark) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header p {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 4px;
}
.save-bar {
  position: sticky;
  top: 0;
  z-index: 99;
  background: linear-gradient(135deg, #14141f 0%, #0a0a12 100%);
  border-bottom: 2px solid var(--gold);
  padding: 12px 20px;
  display: flex;
  gap: 10px;
  max-width: 750px;
  margin: 0 auto 20px;
  border-radius: 0 0 12px 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  flex-wrap: wrap;
}
.save-bar button { flex: 1; min-width: 140px; }
.save-bar .info {
  flex: 1 0 100%;
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
}
.save-bar .info.ok { color: #22c55e; }
.save-bar .info.err { color: #ef4444; }
.admin-box {
  background: linear-gradient(135deg, #14141f 0%, #0a0a12 100%);
  border: 1px solid rgba(245,197,66,0.2);
  margin: 20px auto;
  padding: 22px;
  border-radius: 16px;
  max-width: 750px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.admin-box label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.admin-box input,
.admin-box select {
  width: 100%;
  padding: 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: var(--text-main);
  font-size: 14px;
  font-family: inherit;
  transition: all 0.3s;
}
.admin-box input:focus,
.admin-box select:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(245,197,66,0.05);
}
.admin-box select {
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f5c542' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 18px;
  padding-right: 40px;
}
.admin-box select option { background: #1a1a2e; color: #f0f0f5; padding: 10px; }
.admin-box hr { margin: 22px 0; border: none; border-top: 1px solid rgba(255,255,255,0.08); }
button {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #000;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition: all 0.3s;
  font-family: inherit;
  min-height: 44px;
}
button:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 6px 20px var(--gold-glow); }
button:active { transform: translateY(0); }
button.red { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }
button.blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
button.green { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; }
button.green:hover { box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5); }
.wa-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: stretch; }
.wa-row .country-select { flex: 0 0 175px; min-width: 175px; font-size: 14px; }
.wa-row .number-input { flex: 1; min-width: 0; margin-bottom: 0; }
.country-preview {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 12px;
  padding: 10px 12px;
  background: rgba(245,197,66,0.05);
  border-left: 3px solid var(--gold);
  border-radius: 4px;
  font-family: 'Courier New', monospace;
}
.country-preview b { color: var(--gold); }
.admin-item {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
  padding: 6px;
  background: rgba(255,255,255,0.02);
  border-radius: 8px;
}
.admin-item input {
  flex: 1;
  min-width: 100px;
  margin-bottom: 0;
  padding: 8px 10px;
}
.back-link { text-align: center; margin-top: 25px; }
.back-link a {
  color: var(--gold);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
}
.back-link a:hover { text-shadow: 0 0 15px var(--gold-glow); }
.count-badge {
  display: inline-block;
  background: rgba(245,197,66,0.15);
  color: var(--gold);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  margin-left: 8px;
}
@media (max-width: 520px) {
  .wa-row { flex-direction: column; gap: 10px; }
  .wa-row .country-select,
  .wa-row .number-input {
    flex: 1 1 auto;
    min-width: 100%;
    width: 100%;
  }
  .admin-box { margin: 12px; padding: 16px; }
  .save-bar { padding: 10px 12px; }
  .save-bar button { min-width: 100px; font-size: 12px; padding: 10px 12px; }
}
</style>
</head>
<body>

<!-- ========== LOCK SCREEN ========== -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔐</div>
    <h2>ADMIN ACCESS</h2>
    <p>Enter password to continue</p>
    <input id="passwordInput" type="password" placeholder="••••••••" autocomplete="off">
    <p class="lock-error" id="lockError"></p>
    <button onclick="checkPassword()">🔓 UNLOCK</button>
    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Store</button>
  </div>
</div>

<!-- ========== MAIN CONTENT ========== -->
<div id="mainContent">
  <header>
    <h1>⚙ ADMIN PANEL</h1>
    <p>Castle Crush NFT Management</p>
  </header>

  <div class="save-bar">
    <button onclick="saveItems()" class="green">💾 SAVE ALL</button>
    <button onclick="resetItems()" class="red">🔄 RESET</button>
    <div class="info" id="statusMsg">Ready</div>
  </div>

  <div class="admin-box">
    <label>WhatsApp Number (with country code)</label>
    <div class="wa-row">
      <select id="countrySelect" class="country-select" onchange="updateCountryPreview()">
        <option value="91">🇮🇳 India (+91)</option>
        <option value="27">🇿🇦 South Africa (+27)</option>
        <option value="1">🇺🇸 USA (+1)</option>
        <option value="44">🇬🇧 UK (+44)</option>
        <option value="971">🇦🇪 UAE (+971)</option>
        <option value="966">🇸🇦 Saudi (+966)</option>
        <option value="65">🇸🇬 Singapore (+65)</option>
        <option value="60">🇲🇾 Malaysia (+60)</option>
        <option value="61">🇦🇺 Australia (+61)</option>
        <option value="81">🇯🇵 Japan (+81)</option>
        <option value="86">🇨🇳 China (+86)</option>
        <option value="92">🇵🇰 Pakistan (+92)</option>
        <option value="880">🇧🇩 Bangladesh (+880)</option>
        <option value="977">🇳🇵 Nepal (+977)</option>
        <option value="94">🇱🇰 Sri Lanka (+94)</option>
      </select>
      <input id="waNumberInput" type="tel" class="number-input" placeholder="10-digit number" oninput="updateCountryPreview()">
    </div>
    <div class="country-preview" id="countryPreview">
      Full number: <b>+91 XXXXXXXXXX</b>
    </div>
    <button onclick="saveWA()">💾 Save WhatsApp</button>

    <hr>

    <label>
      All Items
      <span class="count-badge" id="itemCount">0 items</span>
    </label>
    <div id="adminItems"></div>

    <hr>

    <label>Change Admin Password</label>
    <input id="newPassInput" type="password" placeholder="New password (min 4 chars)" style="margin-bottom:10px;">
    <button onclick="changePassword()" class="blue">🔐 Change Password</button>
    <button onclick="lockAdmin()" class="red" style="margin-top:8px; width:100%;">🚪 Lock Panel</button>

    <p class="back-link">
      <a href="index.html">← Back to Store</a>
    </p>
  </div>
</div>

<script>
/* =========================================================
   ⚙️ JSONBIN.IO CONFIGURATION
   ========================================================= */
const JSONBIN_BIN_ID = "6ac357e4ac6210605a14a526";
const JSONBIN_API = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;
const JSONBIN_ACCESS_KEY = "$2a$10$6bFdhxMc0uG0w4bx49sjo.n6rcI1.IQwhBC3jaazynD7ZzkAM9kWS";
/* ========================================================= */

/* =========================================================
   🔐 DEFAULT ADMIN PASSWORD
   Change this to your own password!
   ========================================================= */
const DEFAULT_PASSWORD = "&P00RKILLERz&";
/* ========================================================= */

const defaultItems = [
  {name:"Ape Pirate", price:79, img:"ape_pirate.png"},
  {name:"Archer's Tribe", price:79, img:"archers_tribe.png"},
  {name:"Arrows", price:49, img:"arrows.png"},
  {name:"Fortify", price:49, img:"fortify.png"},
  {name:"Warrior", price:69, img:"warrior.png"},
  {name:"Fan Dancer", price:69, img:"fan_dancer.png"},
  {name:"Giant Growth", price:99, img:"giant_growth.png"},
  {name:"Golem", price:79, img:"golem.png"},
  {name:"Skeletons Swarm", price:59, img:"skeletons_swarm.png"},
  {name:"Skeletons", price:39, img:"skeletons.png"},
  {name:"Nature Heal", price:39, img:"nature_heal.png"},
  {name:"Poison", price:39, img:"poison.png"},
  {name:"Bomb", price:39, img:"bomb.png"},
  {name:"Skeletons Legion", price:79, img:"skeletons_legion.png"},
  {name:"Triplets", price:89, img:"triplets.png"},
  {name:"Executioner", price:149, img:"executioner.png"},
  {name:"Blizzard", price:89, img:"blizzard.png"},
  {name:"Cannon Shot", price:99, img:"cannon_shot.png"},
  {name:"Catapult", price:139, img:"catapult.png"},
  {name:"Dryad", price:149, img:"dryad.png"},
  {name:"Meteor", price:99, img:"meteor.png"},
  {name:"Inferno", price:99, img:"inferno.png"},
  {name:"Gust of Wind", price:89, img:"gust_of_wind.png"},
  {name:"Ice Golem", price:149, img:"ice_golem.png"},
  {name:"Rage", price:89, img:"rage.png"},
  {name:"Magician", price:99, img:"magician.png"},
  {name:"Mud Elemental", price:199, img:"mud_elemental.png"},
  {name:"Orc Warrior", price:99, img:"orc_warrior.png"},
  {name:"Orcs Horde", price:249, img:"orcs_horde.png"},
  {name:"Stone Statue", price:99, img:"stone_statue.png"},
  {name:"Spiked Statue", price:249, img:"spiked_statue.png"},
  {name:"Siege Ballista", price:99, img:"siege_ballista.png"},
  {name:"Lightning", price:149, img:"lightning.png"},
  {name:"Hollow Knight", price:349, img:"hollow_knight.png"},
  {name:"Shaman", price:349, img:"shaman.png"},
  {name:"Archer Queen", price:349, img:"archer_queen.png"},
  {name:"Angel", price:199, img:"angel.png"},
  {name:"Demon", price:169, img:"demon.png"},
  {name:"Fire Elemental", price:269, img:"fire_elemental.png"},
  {name:"Genie Lamp", price:149, img:"genie_lamp.png"},
  {name:"Mage", price:2599, img:"mage.png"},
  {name:"Mana Ritual", price:199, img:"mana_ritual.png"},
  {name:"Black Knight", price:199, img:"black_knight.png"},
  {name:"Metamorph", price:199, img:"metamorph.png"},
  {name:"Skull King", price:199, img:"skull_king.png"},
  {name:"Spectre", price:349, img:"spectre.png"},
  {name:"Reaper", price:199, img:"reaper.png"},
  {name:"Resurrection", price:149, img:"resurrection.png"},
  {name:"Shock", price:149, img:"shock.png"},
  {name:"Standard Bearer", price:159, img:"standard_bearer.png"},
  {name:"Unchained Demon", price:4000, img:"unchained_demon.png"},
  {name:"Wraith", price:199, img:"wraith.png"},
  {name:"Dragon", price:5999, img:"dragon.png"},
  {name:"Storm Elemental", price:2549, img:"storm_elemental.png"},
  {name:"Skull Queen", price:5999, img:"skull_queen.png"},
  {name:"Phoenix", price:5599, img:"phoenix.png"},
  {name:"Black Witch", price:5949, img:"black_witch.png"},
  {name:"Necromancer", price:4949, img:"necromancer.png"}
];

let items = [...defaultItems];
let wa = "919876543210";

/* =========================================================
   🔐 PASSWORD FUNCTIONS
   ========================================================= */
function getAdminPassword(){
  return localStorage.getItem("adminPass") || DEFAULT_PASSWORD;
}

function checkPassword(){
  const input = document.getElementById("passwordInput").value;
  const correct = getAdminPassword();
  const errEl = document.getElementById("lockError");

  if(input === correct){
    // Success — unlock
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("mainContent").classList.add("unlocked");
    sessionStorage.setItem("adminUnlocked", "true");
    loadData();
  } else {
    errEl.textContent = "❌ Wrong password!";
    document.getElementById("passwordInput").value = "";
    document.getElementById("passwordInput").focus();
    setTimeout(() => { errEl.textContent = ""; }, 2500);
  }
}

// Enter key support
document.getElementById("passwordInput").addEventListener("keypress", (e) => {
  if(e.key === "Enter") checkPassword();
});

function changePassword(){
  const newPass = document.getElementById("newPassInput").value.trim();
  if(newPass.length < 4){
    setStatus("❌ Password min 4 characters", "err");
    return;
  }
  localStorage.setItem("adminPass", newPass);
  document.getElementById("newPassInput").value = "";
  setStatus("✅ Password changed!", "ok");
}

function lockAdmin(){
  sessionStorage.removeItem("adminUnlocked");
  location.reload();
}

/* =========================================================
   🔓 AUTO-UNLOCK (session based)
   ========================================================= */
if(sessionStorage.getItem("adminUnlocked") === "true"){
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("mainContent").classList.add("unlocked");
  loadData();
}

/* =========================================================
   ⚙️ MAIN FUNCTIONS
   ========================================================= */
function setStatus(msg, type = ""){
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.className = "info " + type;
  if(type){
    setTimeout(() => { el.textContent = "Ready"; el.className = "info"; }, 3000);
  }
}

function updateCountryPreview(){
  const cc = document.getElementById("countrySelect").value;
  const num = document.getElementById("waNumberInput").value.trim();
  document.getElementById("countryPreview").innerHTML =
    `Full number: <b>+${cc} ${num || "XXXXXXXXXX"}</b>`;
}

async function loadData(){
  try {
    const res = await fetch(JSONBIN_API + "/latest", {
      headers: {
        "X-Bin-Meta": "false",
        "X-Access-Key": JSONBIN_ACCESS_KEY
      }
    });
    if(!res.ok) throw new Error("Load failed");
    const data = await res.json();
    if(data.items && data.items.length > 0) items = data.items;
    if(data.wa){
      wa = data.wa;
      const ccOptions = Array.from(document.getElementById("countrySelect").options).map(o => o.value);
      ccOptions.sort((a,b) => b.length - a.length);
      let matched = "91";
      for(const cc of ccOptions){
        if(wa.startsWith(cc)){ matched = cc; break; }
      }
      document.getElementById("countrySelect").value = matched;
      document.getElementById("waNumberInput").value = wa.substring(matched.length);
      updateCountryPreview();
    }
    renderAdmin();
    setStatus("✅ Connected to server", "ok");
  } catch(e){
    console.error(e);
    setStatus("⚠ Could not load from server", "err");
    renderAdmin();
  }
}

async function saveToServer(){
  try {
    const res = await fetch(JSONBIN_API, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": JSONBIN_ACCESS_KEY
      },
      body: JSON.stringify({ items: items, wa: wa })
    });
    if(!res.ok) throw new Error("Save failed");
    return true;
  } catch(e){
    console.error(e);
    return false;
  }
}

function renderAdmin(){
  const box = document.getElementById("adminItems");
  if(!box) return;
  document.getElementById("itemCount").textContent = items.length + " items";

  let html = "";
  items.forEach((i, idx) => {
    const safeName = i.name.replace(/"/g, "&quot;");
    html += `
      <div class="admin-item">
        <input value="${safeName}" onchange="items[${idx}].name = this.value">
        <input type="number" min="1" value="${i.price}"
               onchange="items[${idx}].price = Math.max(1, parseInt(this.value) || 0)">
      </div>`;
  });
  box.innerHTML = html;
}

async function saveItems(){
  setStatus("Saving to server...");
  const ok = await saveToServer();
  if(ok) setStatus("✅ All items saved!", "ok");
  else setStatus("❌ Save failed. Check internet.", "err");
}

async function saveWA(){
  const cc = document.getElementById("countrySelect").value;
  let num = document.getElementById("waNumberInput").value.trim().replace(/\D/g, "");
  num = num.replace(/^0+/, "");

  if(num.length < 6 || num.length > 13){
    setStatus("❌ Invalid number length", "err");
    return;
  }

  wa = cc + num;
  setStatus("Saving WhatsApp...");
  const ok = await saveToServer();
  if(ok) setStatus("✅ WhatsApp saved: +" + wa, "ok");
  else setStatus("❌ Save failed", "err");
}

async function resetItems(){
  if(!confirm("Reset all items to default? Ye undo nahi hoga.")) return;
  items = [...defaultItems];
  renderAdmin();
  setStatus("Saving reset to server...");
  const ok = await saveToServer();
  if(ok) setStatus("✅ Reset done!", "ok");
  else setStatus("❌ Reset failed", "err");
}
</script>
</body>
</html>
